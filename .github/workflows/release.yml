name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: rsbts
            archive: rsbts-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: rsbts
            archive: rsbts-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            executable: rsbts
            archive: rsbts-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: rsbts.exe
            archive: rsbts-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install release target
        run: rustup target add ${{ matrix.target }}
      - name: Reproduce release validation
        run: |
          cargo test --locked --all-targets
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" rsbts
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "dist/${{ matrix.archive }}" rsbts README.md LICENSE CHANGELOG.md
      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" rsbts
          COPYFILE_DISABLE=1 tar -czf "dist/${{ matrix.archive }}" rsbts README.md LICENSE CHANGELOG.md
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}",README.md,LICENSE,CHANGELOG.md -DestinationPath "dist/${{ matrix.archive }}"
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: SBOM, provenance, and GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install pinned CycloneDX generator
        run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Generate release SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all --override-filename rsbts.cdx
          mv rsbts.cdx.json dist/rsbts.cdx.json
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum rsbts-* > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file CHANGELOG.md
