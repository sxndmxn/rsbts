name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  quality:
    name: Quality and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build warning-free documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Verify release package
        run: cargo package --locked
      - name: Install pinned dependency-policy tool
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, licenses, sources, and bans
        run: cargo deny --locked check
      - name: Install pinned public-API checker
        if: github.event_name == 'pull_request'
        run: cargo install --locked cargo-semver-checks --version 0.49.0
      - name: Check public API compatibility
        if: github.event_name == 'pull_request'
        run: cargo semver-checks --baseline-rev origin/${{ github.base_ref }}

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the complete platform test suite
        run: cargo test --locked --all-targets

  msrv:
    name: Minimum Rust 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install exact minimum toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Run full tests on the minimum toolchain
        run: cargo +1.89.0 test --locked --all-targets

  coverage:
    name: Safety-core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LLVM coverage component
        run: rustup component add llvm-tools-preview
      - name: Install pinned coverage tool
        run: cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Enforce line coverage threshold
        run: >
          cargo llvm-cov --locked --all-targets --all-features
          --ignore-filename-regex 'src/(main|cli|musicbrainz)\.rs'
          --fail-under-lines 75

  mutation:
    name: Safety-core mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned mutation tool
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Require every selected ownership/recovery mutation to be caught
        run: >
          cargo mutants
          --file src/lease.rs
          --file src/db.rs
          --re 'CollectionLease|lease_path|cleanup_move_source|restore_quarantined|remove_if_owned|rollback_regular_import|verify_owned'
          --timeout 45
          --jobs 2
          -- --locked

  scale:
    name: Million-track release thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and measure the published dataset
        env:
          RSBTS_SCALE_DIR: ${{ runner.temp }}
        run: cargo run --locked --manifest-path benchmarks/Cargo.toml --release --quiet

  fuzz:
    name: Fuzz smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal
      - name: Install pinned fuzz runner
        run: cargo +nightly-2026-08-01 install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz query parser
        run: cargo +nightly-2026-08-01 fuzz run query_parser -- -max_total_time=10
      - name: Fuzz path renderer
        run: cargo +nightly-2026-08-01 fuzz run path_rendering -- -max_total_time=10
      - name: Fuzz matching
        run: cargo +nightly-2026-08-01 fuzz run matching -- -max_total_time=10
      - name: Fuzz journal transitions
        run: cargo +nightly-2026-08-01 fuzz run journal_transitions -- -max_total_time=10
