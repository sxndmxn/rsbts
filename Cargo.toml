[package]
name = "rsbts"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "A safe music library manager with provider-neutral metadata matching"
license = "MIT"
repository = "https://github.com/sxndmxn/rsbts"
documentation = "https://docs.rs/rsbts"
keywords = ["music", "library", "musicbrainz", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
dirs = "5"
indicatif = "0.18"
lofty = "0.24"
pathfinding = "4"
reqwest = "0.12"
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"
unicode-normalization = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Panic-inducing code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Debug leftovers
dbg_macro = "deny"
print_stdout = "allow"  # CLI needs prints
print_stderr = "allow"

# Error handling
unwrap_in_result = "deny"
map_err_ignore = "deny"

# Style
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"  # Temporarily, add docs later

# Cargo metadata - these are not critical for development
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
